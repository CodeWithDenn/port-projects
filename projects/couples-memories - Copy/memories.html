<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- keep this page out of search indexes since it's meant to be private -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Our Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- theme, names, dates, photos, and text are all set in config.js — this file just renders them -->
  <body>
    <header class="hero">
      <h1 id="hero-names"></h1>
      <p class="subtitle" id="hero-subtitle"></p>
      <div id="days-counter" class="counter">
        <div class="counter-unit">
          <span class="counter-value" data-unit="years">0</span>
          <span class="counter-label">Years</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" data-unit="months">0</span>
          <span class="counter-label">Months</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" data-unit="days">0</span>
          <span class="counter-label">Days</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" data-unit="hours">0</span>
          <span class="counter-label">Hours</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" data-unit="minutes">0</span>
          <span class="counter-label">Minutes</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" data-unit="seconds">0</span>
          <span class="counter-label">Seconds</span>
        </div>
      </div>
    </header>

    <main>
      <section id="timeline" aria-labelledby="timeline-heading">
        <h2 id="timeline-heading">Our Story</h2>
        <ul class="timeline-list"></ul>
      </section>

      <section id="gallery" aria-labelledby="gallery-heading">
        <h2 id="gallery-heading">Photos</h2>
        <div class="gallery-grid"></div>
      </section>

      <section id="messages" aria-labelledby="messages-heading">
        <h2 id="messages-heading">Messages</h2>
        <ul class="message-list"></ul>
      </section>
    </main>

    <footer>
      <p id="footer-note"></p>
    </footer>

    <div id="photo-modal" class="modal-overlay hidden">
      <button
        type="button"
        id="modal-close"
        class="modal-close"
        aria-label="Close photo"
      >
        &times;
      </button>
      <img id="modal-image" src="" alt="" class="modal-image" />
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
