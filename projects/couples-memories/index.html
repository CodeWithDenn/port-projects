<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Our Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="assets/icon/couple-memories-icon.png" type="image/x-icon">
  </head>
  <body class="lock-page">
    <main class="lock-panel">
      <p class="lock-kicker">A little something for us</p>
      <h1>Our Memories</h1>
      <p class="lock-prompt">Enter our special date to unlock the story.</p>
      <form id="lock-form" class="lock-form" autocomplete="off">
        <label for="lock-digit-1">Special date</label>
        <div class="pin-inputs" id="pin-container">
          <input id="lock-digit-1" name="lock-digit-1" type="password" inputmode="numeric" maxlength="1" class="pin-digit" autofocus required aria-label="PIN digit 1" />
          <input id="lock-digit-2" name="lock-digit-2" type="password" inputmode="numeric" maxlength="1" class="pin-digit" required aria-label="PIN digit 2" />
          <input id="lock-digit-3" name="lock-digit-3" type="password" inputmode="numeric" maxlength="1" class="pin-digit" required aria-label="PIN digit 3" />
          <input id="lock-digit-4" name="lock-digit-4" type="password" inputmode="numeric" maxlength="1" class="pin-digit" required aria-label="PIN digit 4" />
          <input id="lock-digit-5" name="lock-digit-5" type="password" inputmode="numeric" maxlength="1" class="pin-digit" required aria-label="PIN digit 5" />
          <input id="lock-digit-6" name="lock-digit-6" type="password" inputmode="numeric" maxlength="1" class="pin-digit" required aria-label="PIN digit 6" />
        </div>
        <button type="submit">Unlock</button>
        <p id="lock-error" class="lock-error" role="alert" hidden></p>
      </form>
    </main>
    <script>
      window.LOCK_CONFIG = {
        storageKey: "couples-memories-denn-bebelyn-unlocked",
        //to make a new password, do this in the terminal of vscode
        //node -e "const crypto=require('crypto'); console.log(crypto.createHash('sha256').update('01/01/26').digest('hex'))"  
          codeHash: "3665cbec89060b84d378f1818d11c35b9fde423ad87613f2c2fd94f8922f66d5",
        destination: "memories.html",
      };
    </script>
    <script src="lock.js"></script>
  </body>
</html>
