<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Our Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="assets/icon/couple-memories-icon.png" type="image/x-icon">
  </head>
  <body class="lock-page">
    <main class="lock-panel">
      <p class="lock-kicker">A little something for us</p>
      <h1>Our Memories</h1>
      <p class="lock-prompt">Enter our special date to unlock the story.</p>
      <form id="lock-form" class="lock-form">
        <label for="lock-code">Special date</label>
          <input id="lock-code" name="lock-code" type="password" inputmode="numeric" autocomplete="off" placeholder="MMDDYY" pattern="\d{6}" maxlength="6" required />
        <button type="submit">Unlock</button>
        <p id="lock-error" class="lock-error" role="alert" hidden></p>
      </form>
    </main>
    <script src="config.js"></script>
    <script>
      window.LOCK_CONFIG = {
        storageKey: CONFIG.lock.storageKey,
          code: CONFIG.lock.code,
        destination: "memories.html",
      };
    </script>
    <script src="lock.js"></script>
  </body>
</html>
